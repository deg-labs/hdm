name: deploy-to-gce

on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd
        default: prd

jobs:
  prepare:
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'dev' || github.event.label.name == 'stg' || github.event.label.name == 'prd'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pack deployment artifact
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > .gce-deploy-source
          tar --exclude=.git --exclude=.github --exclude=.env --exclude='.env.*' --exclude-from=.gce-deployignore -czf "$RUNNER_TEMP/deploy.tar.gz" .
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: gce-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy.tar.gz
          if-no-files-found: error

  deploy:
    needs: prepare
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'dev' || github.event.label.name == 'stg'))
    uses: deg-labs/github-workflows/.github/workflows/gce-deploy.yml@e107b24457a81d5c2c66da436a3b9aa4110097ed
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      enforce_deploy_team: true
      environment_name: >-
        ${{
          github.event_name == 'pull_request' && github.event.label.name ||
          github.event_name == 'workflow_dispatch' && inputs.environment ||
          'prd'
        }}
      runtime_env_secret: >-
        ${{
          (github.event_name == 'pull_request' && github.event.label.name == 'dev' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') && 'DEV_DISCORD_WEBHOOK_URL' ||
          (github.event_name == 'pull_request' && github.event.label.name == 'stg' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'stg') && 'STG_DISCORD_WEBHOOK_URL' ||
          'PRD_DISCORD_WEBHOOK_URL'
        }}
      runtime_file_secret: >-
        ${{
          (github.event_name == 'pull_request' && github.event.label.name == 'dev' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') && 'DEV_ADDRESSES_TXT' ||
          (github.event_name == 'pull_request' && github.event.label.name == 'stg' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'stg') && 'STG_ADDRESSES_TXT' ||
          'PRD_ADDRESSES_TXT'
        }}
      deploy_mode: compose
      artifact_id: ${{ needs.prepare.outputs.artifact_id }}
      runtime_env_key: DISCORD_WEBHOOK_URL
      runtime_file_name: addresses.txt
