name: deploy-to-gce

on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd
        default: prd

jobs:
  deploy:
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'dev' || github.event.label.name == 'stg'))
    uses: deg-labs/github-workflows/.github/workflows/gce-deploy.yml@3ad67e6311ea94befd139afe7c6d6a26a040baa0
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      enforce_deploy_team: true
      environment_name: >-
        ${{
          github.event_name == 'pull_request' && github.event.label.name ||
          github.event_name == 'workflow_dispatch' && inputs.environment ||
          'prd'
        }}
      discord_webhook_secret: >-
        ${{
          (github.event_name == 'pull_request' && github.event.label.name == 'dev' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') && 'DEV_DISCORD_WEBHOOK_URL' ||
          (github.event_name == 'pull_request' && github.event.label.name == 'stg' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'stg') && 'STG_DISCORD_WEBHOOK_URL' ||
          'PRD_DISCORD_WEBHOOK_URL'
        }}
      addresses_secret: >-
        ${{
          (github.event_name == 'pull_request' && github.event.label.name == 'dev' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') && 'DEV_ADDRESSES_TXT' ||
          (github.event_name == 'pull_request' && github.event.label.name == 'stg' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'stg') && 'STG_ADDRESSES_TXT' ||
          'PRD_ADDRESSES_TXT'
        }}
      notification_suppression_seconds: ${{ vars.NOTIFICATION_SUPPRESSION_SECONDS || '3600' }}
      deploy_mode: compose
