name: deploy-to-gce

on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd
        default: prd

jobs:
  deploy:
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'dev' || github.event.label.name == 'stg'))
    uses: deg-labs/github-workflows/.github/workflows/gce-deploy.yml@main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      enforce_deploy_team: true
      environment_name: >-
        ${{
          github.event_name == 'pull_request' && github.event.label.name ||
          github.event_name == 'workflow_dispatch' && inputs.environment ||
          'prd'
        }}
      discord_webhook_secret: >-
        ${{
          (github.event_name == 'pull_request' && github.event.label.name == 'dev' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') && 'DEV_DISCORD_WEBHOOK_URL' ||
          (github.event_name == 'pull_request' && github.event.label.name == 'stg' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'stg') && 'STG_DISCORD_WEBHOOK_URL' ||
          'PRD_DISCORD_WEBHOOK_URL'
        }}
      addresses_secret: >-
        ${{
          (github.event_name == 'pull_request' && github.event.label.name == 'dev' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') && 'DEV_ADDRESSES_TXT' ||
          (github.event_name == 'pull_request' && github.event.label.name == 'stg' ||
           github.event_name == 'workflow_dispatch' && inputs.environment == 'stg') && 'STG_ADDRESSES_TXT' ||
          'PRD_ADDRESSES_TXT'
        }}
      notification_suppression_seconds: ${{ vars.NOTIFICATION_SUPPRESSION_SECONDS || '3600' }}
      artifact_excludes: |
        data
      additional_upload_files: |
        .env
      prepare_command: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y gettext-base
        export DB_DIRECTORY='./data'
        envsubst < .env.template > .env
        printf '%s' "${ADDRESSES_TXT}" > addresses.txt
      remote_deploy_command: |
        set -e
        TARGET_DIR='/opt/apps/hdm'
        sudo rm -rf "$TARGET_DIR"
        sudo mkdir -p "$TARGET_DIR"
        sudo chown -R "$(id -u):$(id -g)" "$TARGET_DIR"
        tar -xzf ~/app.tar.gz -C "$TARGET_DIR"
        mv -f ~/.env "$TARGET_DIR/.env"
        cd "$TARGET_DIR"
        sudo docker compose down
        sudo docker compose up -d --build
        sudo docker image prune -f || true
