services:
  hdm:
    build: .
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TZ=Asia/Tokyo
      - DB_DIRECTORY=./data
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data
      - ./addresses.txt:/app/addresses.txt # If you want to manage addresses.txt outside the container
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      # The monitor loop updates this heartbeat even when there are no fills.
      test:
        - CMD
        - python
        - -c
        - "import os,time; from pathlib import Path; p=Path(os.getenv('HEALTHCHECK_FILE', '/tmp/healthcheck.txt')); assert p.is_file() and 0 <= time.time()-p.stat().st_mtime < 120"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
